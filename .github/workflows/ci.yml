# Integración continua: en cada PR y en cada push a main se revisa el código (lint),
# se corren las pruebas del backend contra un PostgreSQL desechable y se compila el frontend.
# No usa Neon ni ningún secreto: la base de datos de las pruebas vive solo mientras corre el job.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint + pruebas)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: gps
          POSTGRES_PASSWORD: gps
          POSTGRES_DB: jya_gps_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gps -d jya_gps_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://gps:gps@localhost:5432/jya_gps_test
      DB_SSL: 'false'
      # Solo para esta base desechable de CI; no sirve para nada más.
      JWT_SECRET: ci-solo-para-pruebas-no-usar-en-produccion-0123456789
      CORS_ORIGIN: http://localhost:5173
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run db:migrate
      - run: npm test

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
